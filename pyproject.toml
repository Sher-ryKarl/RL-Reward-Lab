[project]
name = "rl-reward-lab"
version = "0.1.0"
description = "RL Reward Function Design & Automated Tuning Visualization Platform"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Core
    "fastapi[standard]>=0.135.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # RL
    "stable-baselines3[extra]>=2.3.0",
    "sb3-contrib>=2.3.0",
    "gymnasium[classic-control]>=0.29,<1.0",
    "rl_zoo3>=2.3.0",
    # Reward Learning (IRL/RLHF — used from v0.5, optional in v0.1)
    "imitation>=1.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    # Experiment Tracking
    "mlflow>=3.7.0",
    # Config
    "omegaconf>=2.3.0",
    # Utilities
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
